<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Panel Apps de Viajes</title>
<meta name="theme-color" content="#0b0c0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Panel Viajes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icono-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
@font-face{font-family:Marcellus;src:url(fonts/marcellus.woff2) format("woff2");font-display:swap}
:root{--bg:#0b0c0f;--card:#14161c;--card2:#1b1e26;--line:#262a34;--tx:#eef1f6;--soft:#c4cbd7;--mute:#8d96a6;--ac:#8fb4ff;--ac2:#f2c46d;--ok:#5fd39a;--band:#3a4660;
  --f:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 var(--f);padding:env(safe-area-inset-top) 0 calc(28px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:5;background:rgb(11 12 15/.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;gap:10px;padding:12px 16px;max-width:560px;margin:0 auto}
.hd h1{font:400 23px/1.1 Marcellus,serif;margin:0;flex:1;letter-spacing:.2px}
.hd small{display:block;font:12.5px var(--f);color:var(--mute);margin-top:3px}
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px;vertical-align:1px;box-shadow:0 0 0 0 rgb(95 211 154/.6);animation:pulse 2s infinite}
.live.off{background:var(--mute);animation:none}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgb(95 211 154/0)}100%{box-shadow:0 0 0 0 rgb(95 211 154/0)}}
.ib{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer}
.ib svg{width:20px;height:20px}
.ib.spin svg{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:14px 0 4px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px}
.seg button{border:0;background:none;border-radius:10px;padding:9px 0;font-size:15px;color:var(--soft);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--card2);color:var(--tx);font-weight:600;box-shadow:inset 0 0 0 1px var(--line)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 10px}
.kpi b{display:block;font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;margin:12px 0;overflow:hidden}
.ch{display:flex;align-items:center;gap:10px;padding:12px 14px 4px}
.ch h2{font:400 20px/1.2 Marcellus,serif;margin:0;flex:1}
.ch em{font-style:normal;font-size:13px;color:var(--mute)}
.cb{padding:6px 14px 14px}
.chart{width:100%;height:150px;display:block}
.chart text{fill:var(--mute);font:11px var(--f)}
.note{font-size:13px;color:var(--mute);margin:6px 0 0}
.app{border-top:1px solid var(--line)}
.app:first-child{border-top:0}
.ah{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;background:none;border:0;text-align:left;cursor:pointer}
.av{position:relative;overflow:hidden;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font:400 19px Marcellus,serif;flex:none;color:#0b0c0f}.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.an{flex:1;min-width:0}
.an b{display:block;font-size:16.5px;line-height:1.25}
.an small{font-size:13px;color:var(--mute)}
.an small i{font-style:normal;color:var(--ok)}
.am{text-align:right;font-variant-numeric:tabular-nums}
.am b{font-size:20px;display:block;line-height:1}
.am span{font-size:12px;color:var(--mute)}
.spark{width:52px;height:26px;flex:none}
.chev{width:18px;height:18px;flex:none;color:var(--mute);transition:transform .2s}
.ah[aria-expanded=true] .chev{transform:rotate(180deg)}
.noanim .bar .bt i{animation:none}
.bar.zero .bl,.bar.zero .bv{opacity:.45}
.flg{width:20px;height:14px;object-fit:cover;border-radius:2px;vertical-align:-2px;margin-right:7px;box-shadow:0 0 0 1px rgb(255 255 255/.12)}
.ad{padding:0 14px 14px}.cb.ad{padding-top:0}.cb.ad>h3:first-child{margin-top:6px}
.hd h1.sm{font-size:20px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hd .av{width:38px;height:38px;border-radius:10px;font-size:17px}
.sec{font:400 21px/1.2 Marcellus,serif;margin:26px 4px 4px;color:var(--soft)}
.back2{display:flex;align-items:center;justify-content:center;gap:8px;margin:18px 0 6px}.back2 svg{width:18px;height:18px}
.ad h3{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--mute);margin:14px 0 8px;font-weight:600}
.bars{display:grid;gap:7px}
.bar{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:14.5px}
.bar .bl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--soft)}
.bar .bv{font-variant-numeric:tabular-nums;font-weight:600}
.bar .bt{grid-column:1/-1;height:7px;border-radius:4px;background:var(--card2);overflow:hidden}
.bar .bt i{display:block;height:100%;border-radius:4px;background:var(--ac);transform-origin:left;animation:grow .6s ease-out}
@keyframes grow{from{transform:scaleX(0)}}
.steps{display:flex;gap:6px}
.step{flex:1;text-align:center;background:var(--card2);border-radius:10px;padding:8px 2px}
.step b{display:block;font-size:19px}.step span{font-size:12px;color:var(--mute)}
.step.on{background:rgb(95 211 154/.16);box-shadow:inset 0 0 0 1px rgb(95 211 154/.45)}
.heat{display:grid;grid-template-columns:repeat(24,1fr);gap:2px;margin-top:4px}
.heat i{aspect-ratio:1/2.2;border-radius:3px;background:var(--card2)}
.hl{display:flex;justify-content:space-between;font-size:11px;color:var(--mute);margin-top:4px}
.empty{color:var(--mute);font-size:14.5px;padding:4px 0}
.demo-p{border-top:1px solid var(--line);padding:12px 0}.demo-p:first-child{border-top:0;padding-top:4px}
.dp-h{display:flex;gap:12px;align-items:center;margin-bottom:8px}
.dp-a{margin:10px 0 0}.dloc{font-size:14px;color:var(--soft)}.dp-a>b{font-size:15.5px}.dp-a .bars{margin-top:8px}
.list2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.setup{max-width:520px;margin:40px auto;padding:0 18px}
.setup h1{font:400 30px/1.15 Marcellus,serif;margin:0 0 8px}
.setup p{color:var(--soft)}
.setup ol{color:var(--soft);padding-left:22px}
.setup input{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--tx);font:15px ui-monospace,monospace;margin:8px 0 12px}
.btn{display:block;width:100%;padding:14px;border-radius:14px;border:0;background:var(--ac);color:#0b0c0f;font-weight:700;font-size:16px;cursor:pointer}
.btn.g{background:none;color:var(--soft);border:1px solid var(--line);margin-top:10px;font-weight:500}
.err{background:rgb(255 107 107/.12);border:1px solid rgb(255 107 107/.4);color:#ffb3b3;border-radius:12px;padding:10px 12px;font-size:14px;margin:12px 0}
.demo{background:rgb(242 196 109/.14);border:1px solid rgb(242 196 109/.4);color:var(--ac2);border-radius:12px;padding:8px 12px;font-size:13.5px;margin:12px 0 0}
.priv{font-size:12.5px;color:var(--mute);text-align:center;margin:18px 0 0}
.sheet{position:fixed;inset:0;z-index:20;background:rgb(0 0 0/.55);display:grid;align-items:end}
.sheet>div{background:var(--card);border-top-left-radius:20px;border-top-right-radius:20px;padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-width:560px;width:100%;margin:0 auto}
.sheet h2{font:400 22px Marcellus,serif;margin:0 0 10px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<script>
/* Panel Apps de Viajes: lee las estadísticas anónimas de GoatCounter de las apps de Javier.
   El token se guarda solo en este celular (localStorage) y nunca está en el código. */
const GC="https://javierov.goatcounter.com/api/v0";
const K={tok:"pav-token",per:"pav-per",open:"pav-open"};
const LS={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const COLS=["#8fb4ff","#f2c46d","#5fd39a","#ff9f8a","#c9a7ff","#6fd6e8","#f59fd0","#b7d36a"];
const IC={
 ref:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 4v5h-5"/></svg>',
 gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
 next:'<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>',
 back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg>',
 chev:'<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>'};
const PER=[["hoy","Hoy",0],["7","7 días",6],["30","30 días",29],["90","3 meses",89]];
let per=LS.get(K.per)||"7",DATA=null,busy=false,timer=null,demo=false,lastErr="",openApp=LS.get(K.open)||"";

/* ---------- fechas ---------- */
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
function range(){const p=PER.find(x=>x[0]===per)||PER[1];const e=new Date();const s=new Date();s.setDate(s.getDate()-p[2]);s.setHours(0,0,0,0);
  const iso=d=>d.toISOString().replace(/\.\d+Z$/,"Z");/* fechas con hora: con solo la fecha, GoatCounter deja fuera el día de hoy */
  return{start:ymd(s),end:ymd(e),days:p[2]+1,qs:iso(s),qe:iso(new Date(e.getTime()+60000))}}
const DOW=["dom","lun","mar","mié","jue","vie","sáb"];
const MES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const dlabel=s=>{const d=new Date(s+"T12:00:00");return DOW[d.getDay()]+" "+d.getDate()};
const fmtN=n=>n>=1000?(n/1000).toFixed(n>=10000?0:1).replace(".",",")+" mil":String(n);
/* GoatCounter entrega las horas («hourly») en la zona horaria de la cuenta (Europe/Madrid), NO en UTC.
   Se convierten a la hora real con esa zona; la zona se lee de /me la primera vez y se guarda en pav-tz */
let TZ=LS.get("pav-tz")||"Europe/Madrid";
function tzOff(d,tz){try{const p={};new Intl.DateTimeFormat("en-US",{timeZone:tz,hourCycle:"h23",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit"}).formatToParts(d).forEach(x=>p[x.type]=x.value);
  return Date.UTC(+p.year,+p.month-1,+p.day,+p.hour%24,+p.minute,+p.second)-d.getTime()}catch(e){return 0}}
function siteTime(day,h){const g=new Date(day+"T"+pad(h)+":00:00Z").getTime();let t=g-tzOff(new Date(g),TZ);t=g-tzOff(new Date(t),TZ);return new Date(t)}
function localHourly(stats){/* devuelve [{t: inicio de esa hora, n}] */const out=[];
  (stats||[]).forEach(s=>(s.hourly||[]).forEach((n,h)=>{if(!n)return;out.push({t:siteTime(s.day,h),n})}));return out}
function ago(t){const m=Math.round((Date.now()-t)/60000);if(m<2)return"ahora mismo";if(m<60)return"hace "+m+" min";const h=Math.round(m/60);if(h<24)return"hace "+h+" h";const d=Math.round(h/24);return d===1?"ayer":"hace "+d+" días"}

/* ---------- API ---------- */
async function api(path,params,tries=0){
  if(demo)return DEMO(path,params);
  try{return await api1(path,params)}catch(e){
    /* GoatCounter permite 4 consultas por segundo: si se pasa, el navegador solo ve «Failed to fetch». Se espera y se reintenta */
    if(e.message!=="token"&&tries<3){await wait(1200*(tries+1));return api(path,params,tries+1)}throw e}}
/* todas las consultas pasan por una cola: así las de cada app o demo no chocan con la carga principal */
let QQ=Promise.resolve();
function api1(path,params){const r=QQ.then(()=>api1x(path,params));QQ=r.catch(()=>{}).then(()=>wait(300));return r}
async function api1x(path,params){
  const u=new URL(GC+path);Object.entries(params||{}).forEach(([k,v])=>u.searchParams.set(k,v));
  const r=await fetch(u,{headers:{Authorization:"Bearer "+LS.get(K.tok),"Content-Type":"application/json"}});
  if(r.status===401||r.status===403)throw new Error("token");
  if(r.status===429)throw new Error("429");
  if(!r.ok)throw new Error("HTTP "+r.status+" en "+path);
  return r.json()}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function load(){
  if(busy)return;busy=true;$("#rf")&&$("#rf").classList.add("spin");
  const R0=range();
    /* GoatCounter guarda las visitas por HORA: si se pide desde las 11:02, la hora de las 11 queda fuera entera. Se redondea a la hora en punto */
    let D0=LS.get("pav-desde");if(D0){const d=new Date(D0);d.setMinutes(0,0,0);D0=d.toISOString().replace(/\.\d+Z$/,"Z")}const q={start:D0&&D0>R0.qs?D0:R0.qs,end:R0.qe};
  try{
    const total=await api("/stats/total",q);await wait(400);
    if(!demo&&!LS.get("pav-tz")){try{const me=await api("/me",{});const z=String(((me.user||{}).settings||{}).timezone||"").replace(/^[A-Z]{2}\./,"");if(z){TZ=z;LS.set("pav-tz",z)}}catch(e){}await wait(400)}
    let hits=[],more=true,guard=0;
    while(more&&guard<5){const r=await api("/stats/hits",Object.assign({limit:100},q,hits.length?{exclude_paths:hits.map(h=>h.path_id).join(",")}:{}));hits=hits.concat(r.hits||[]);more=r.more;guard++;await wait(400)}
    let known=[];if(q.start!==R0.qs){try{known=((await api("/stats/hits",{start:R0.qs,end:R0.qe,limit:100})).hits||[]).filter(h=>!h.event)}catch(e){}await wait(400)}
    const side={};let sq=q;
    /* país y equipo solo vienen por día completo: si se cuenta «desde» una hora, se empieza al día siguiente */
    if(D0&&D0>R0.qs){const d=new Date(D0);d.setHours(24,0,0,0);sq={start:d.toISOString().replace(/\.\d+Z$/,"Z"),end:q.end};side.from=d}
    if(!side.from||side.from<new Date()){for(const p of["locations","systems","browsers","sizes"]){try{side[p]=(await api("/stats/"+p,Object.assign({limit:8},sq))).stats||[]}catch(e){side[p]=[]}await wait(400)}}else side.later=true
    if(!DATA)ANIM=true;DATA={total,hits,side,known,sq,at:new Date()};lastErr="";SUB.old=SUB.c;SUB.c={};demoSide()}
  catch(e){lastErr=e.message==="token"?"token":e.message}
  busy=false;render()}

/* ---------- agrupar por app ---------- */
/* clave de la app según la ruta: /demo-x/… → «demo-x»; las apps guardadas dentro del portafolio (/apps/s21-bny/…) → «apps/s21-bny» */
function appKey(p){const seg=String(p).replace(/^\/+|\/+$/g,"").split("/");return(seg[0]==="apps"&&seg[1]?"apps/"+seg[1]:seg[0])||"(inicio)"}
function group(){
  const apps={},byName={};
  const pv=DATA.hits.filter(h=>!h.event),ev=DATA.hits.filter(h=>h.event&&!/^demo:/.test(h.path));
  pv.forEach(h=>{const key=appKey(h.path);
    const a=apps[key]||(apps[key]={key,title:"",visits:0,stats:[],ev:[],short:"",pids:[]});
    a.visits+=h.count;a.pids.push(h.path_id);if(!a.title&&h.title)a.title=h.title;a.stats=a.stats.concat(h.stats||[])});
  (DATA.known||[]).forEach(h=>{const key=appKey(h.path);if(!apps[key])apps[key]={key,title:h.title||"",visits:0,stats:[],ev:[],short:"",pids:[]}});
  Object.values(apps).forEach(a=>{a.title=a.title||a.key.replace(/^demo-/,"").replace(/-/g," ")});
  ev.forEach(h=>{const i=h.path.indexOf(" · ");const pre=i>0?h.path.slice(0,i):"Otras";const act=i>0?h.path.slice(i+3):h.path;
    let a=Object.values(apps).find(x=>(x.title+" "+x.key).toLowerCase().includes(pre.toLowerCase()));
    if(!a)a=apps["ev:"+pre]||(apps["ev:"+pre]={key:"ev:"+pre,title:pre,visits:0,stats:[],ev:[],pids:[]});
    a.short=pre;a.ev.push({act,n:h.count,stats:h.stats})});
  /* el portafolio solo manda eventos «demo:<tag> · Portafolio · …»: se muestra como una app más */
  DATA.hits.filter(h=>h.event&&/^demo:[^·]+ · Portafolio · /.test(h.path)).forEach(h=>{const act=h.path.split(" · ").slice(2).join(" · ");
    const a=apps["(portafolio)"]||(apps["(portafolio)"]={key:"(portafolio)",title:"Portafolio",visits:0,stats:[],ev:[],short:"Portafolio",pids:[],folio:true});
    if(act==="abrió el portafolio"){a.visits+=h.count;a.stats=a.stats.concat(h.stats||[]);a.pids.push(h.path_id)}else a.ev.push({act,n:h.count,stats:h.stats})});
  const list=Object.values(apps).map(a=>{const hh=localHourly(a.stats).concat(...a.ev.map(e=>localHourly(e.stats)));
    a.last=hh.length?Math.max(...hh.map(x=>+x.t))+3599e3:0;if(a.last>Date.now())a.last=Date.now();
    a.actions=a.ev.filter(e=>!/^usó \d+ min$/.test(e.act)).reduce((s,e)=>s+e.n,0);return a});
  list.sort((a,b)=>b.last-a.last||b.visits-a.visits);
  list.forEach((a,i)=>a.col=COLS[i%COLS.length]);return list}

/* ---------- demos enviadas (enlaces ?de=nombre) ---------- */
function demos(){const P={};
  DATA.hits.filter(h=>h.event&&/^demo:/.test(h.path)).forEach(h=>{const parts=h.path.slice(5).split(" · ");if(parts.length<3)return;const [who,app,...rest]=parts;const act=rest.join(" · ");
    const p=P[who]||(P[who]={who,apps:{},last:0});const a=p.apps[app]||(p.apps[app]={app,opens:0,max:0,acts:[],open:[],all:[]});a.all.push(h.path_id);if(/^abrió (la app|el portafolio)$/.test(act))a.open.push(h.path_id);
    const hh=localHourly(h.stats);const l=hh.length?Math.max(...hh.map(x=>+x.t))+3599e3:0;if(l>p.last)p.last=Math.min(l,Date.now());
    let m;if(act==="abrió la app"||act==="abrió el portafolio")a.opens+=h.count;else if(m=act.match(/^usó (\d+) min$/))a.max=Math.max(a.max,+m[1]);else a.acts.push([act,h.count])});
  return Object.values(P).sort((a,b)=>b.last-a.last)}

/* ---------- desde dónde y equipo de UNA app o demo (include_paths) ---------- */
const SUB={c:{},old:{}};/* caché de esta carga; mientras llega lo nuevo se muestra lo de la carga anterior (sin parpadeo) */
const RN=(()=>{try{return new Intl.DisplayNames(["es"],{type:"region"})}catch(e){return null}})();
/* bandera como imagen: Windows no dibuja los emojis de banderas (salía «CL Chile») */
const flagImg=c=>/^[A-Z]{2}$/.test(c)?`<img class="flg" src="https://flagcdn.com/w40/${c.toLowerCase()}.png" alt="" loading="lazy" onerror="this.remove()">`:"";
function locItems(x){return(x||[]).filter(s=>s.count>0).map(s=>{const c=String(s.id||"").split("-")[0].toUpperCase();let n=s.name||s.id||"?";try{if(RN&&/^[A-Z]{2}$/.test(c))n=RN.of(c)}catch(e){}return[n,s.count,flagImg(c)]})}
function sideFor(id,pids,pages){/* devuelve lo que ya llegó, o null y lo pide */
  const S=DATA&&DATA.side;if(!S||S.later||!pids||!pids.length)return{none:true};
  id=per+"|"+(LS.get("pav-desde")||"")+"|"+id;const prev=SUB.old[id]&&SUB.old[id].done?SUB.old[id]:null;
  const c=SUB.c[id];if(c)return c.done?c:prev;
  const o=SUB.c[id]={done:false},mine=SUB.c;
  if(prev)Object.assign(o,prev,{done:false});
  (async()=>{for(const p of pages){try{o[p]=(await api("/stats/"+p,Object.assign({limit:p==="locations"?12:6,include_paths:pids.join(",")},DATA.sq))).stats||[]}catch(e){o[p]=null}}o.done=true;if(SUB.c===mine)render()})();
  return prev}
/* el país lo calcula GoatCounter con la IP de la conexión, no con la ubicación del teléfono */
const CONX="El país sale de la conexión a internet, no de dónde está la persona: con datos móviles de una tarjeta chilena suele salir Chile aunque estén en España; con wifi o una tarjeta española, sale España.";
function dayNote(){const S=DATA.side;return S.from?`El país y el equipo se guardan por día completo: con «Empezar a contar» se ven desde el ${S.from.getDate()} ${MES[S.from.getMonth()]}.`:"El país y el equipo se guardan por día completo."}
function appSide(a){
  const card=(t,b,em)=>`<section class="card"><div class="ch"><h2>${t}</h2>${em?`<em>${em}</em>`:""}</div><div class="cb">${b}</div></section>`;
  if(DATA.side.later)return card("Desde dónde",`<p class="empty">Aparecerá desde mañana: el país y el equipo se guardan por día completo y hoy empezaste a contar.</p>`);
  if(!a.pids.length)return card("Desde dónde",`<p class="empty">Sin visitas en estos días.</p>`);
  const r=sideFor("app:"+a.key,a.pids,["locations","systems","sizes"]);
  if(!r)return card("Desde dónde",`<p class="empty">Cargando…</p>`);
  const sys=r.systems?barsList(r.systems.filter(x=>x.count>0).map(x=>[x.name||x.id,x.count]),a.col):'<p class="note">—</p>';
  const siz=r.sizes?barsList(r.sizes.filter(x=>x.count>0).map(x=>[sizeName(x.name||x.id),x.count]),a.col):'<p class="note">—</p>';
  return card("Desde dónde",(r.locations===null?'<p class="note">No pude cargarlo ahora.</p>':barsList(locItems(r.locations),a.col))+`<p class="note">${CONX} ${dayNote()} Cuenta personas distintas por día, por eso puede no coincidir con las visitas.</p>`,"según su conexión a internet")
    +card("Con qué equipo",`<div class="list2"><div><h3 class="note" style="margin:0 0 8px">Sistema</h3>${sys}</div><div><h3 class="note" style="margin:0 0 8px">Pantalla</h3>${siz}</div></div>`)}
function demoSide(){/* países de las demos: se piden en segundo plano después de la carga */
  if(!DATA||DATA.side.later)return;demos().forEach(p=>Object.values(p.apps).forEach(a=>sideFor("demo:"+p.who+"|"+a.app,a.open.length?a.open:a.all,["locations"])))}
function demoLoc(p,a){if(DATA.side.later)return"";const r=sideFor("demo:"+p.who+"|"+a.app,a.open.length?a.open:a.all,["locations"]);
  if(!r)return' <span class="dloc">…</span>';if(r.none||!r.locations)return"";const L=locItems(r.locations);if(!L.length)return' <span class="dloc">→ país aún sin datos</span>';
  return' <span class="dloc">→ '+L.slice(0,3).map(([n,c,fl])=>fl+esc(n)+(L.length>1?" "+c:"")).join(" · ")+"</span>"}
/* ---------- pestañas que trae cada app: se leen del menú de su propia página (#nav [data-go]) ---------- */
const MENU={};/* clave → {tabs:[…]} o {fail:true} */
function menuFor(key){if(!key||/^\(|^ev:/.test(key))return{fail:true};
  if(MENU[key])return MENU[key].done?MENU[key]:null;
  try{const c=JSON.parse(LS.get("pav-menu:"+key)||"null");if(c&&Date.now()-c.at<6*3600e3){MENU[key]=Object.assign({done:true},c);return MENU[key]}}catch(e){}
  const o=MENU[key]={done:false};
  fetch("../"+key.split("/").map(encodeURIComponent).join("/")+"/",{cache:"no-store"}).then(r=>r.ok?r.text():Promise.reject()).then(t=>{
    const d=new DOMParser().parseFromString(t,"text/html");
    const tabs=[...d.querySelectorAll("#nav [data-go]")].map(b=>b.textContent.replace(/\s+/g," ").trim()).filter(Boolean);
    if(!tabs.length)throw 0;o.tabs=[...new Set(tabs)];o.at=Date.now();LS.set("pav-menu:"+key,JSON.stringify({tabs:o.tabs,at:o.at}))
  }).catch(()=>{o.fail=true}).finally(()=>{o.done=true;render()});
  return null}
/* ---------- dibujos ---------- */
function barsChart(vals,labels,h=150,col){
  const W=340,H=h,pb=20,pt=14,max=Math.max(1,...vals),n=vals.length,gw=W/n,bw=Math.max(3,Math.min(26,gw*.62));
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Gráfico de actividad">`;
  for(let i=1;i<=3;i++){const y=pt+(H-pb-pt)*(1-i/3);s+=`<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="#262a34" stroke-dasharray="2 4"/>`}
  vals.forEach((v,i)=>{const bh=(H-pb-pt)*v/max,x=i*gw+(gw-bw)/2,y=H-pb-bh;
    s+=`<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(bh,v?2:0)}" rx="3" fill="${v?(col||"#8fb4ff"):"#262a34"}">${ANIM?`<animate attributeName="height" from="0" to="${Math.max(bh,v?2:0)}" dur=".5s"/><animate attributeName="y" from="${H-pb}" to="${y}" dur=".5s"/>`:""}</rect>`;
    if(v&&(n<=14||v===max))s+=`<text x="${x+bw/2}" y="${y-4}" text-anchor="middle" style="fill:#c4cbd7">${v}</text>`;
    const step=n>14?Math.ceil(n/7):1;if(i%step===0||i===n-1&&n<=14)s+=`<text x="${x+bw/2}" y="${H-5}" text-anchor="middle">${labels[i]}</text>`});
  return s+"</svg>"}
function spark(vals,col){const W=64,H=28,max=Math.max(1,...vals),n=vals.length;if(n<2)return"";
  const pts=vals.map((v,i)=>[(i/(n-1))*W,H-2-(H-6)*v/max]);const d=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join("");
  return `<svg class="spark" viewBox="0 0 ${W} ${H}"><path d="${d} L${W} ${H} L0 ${H}Z" fill="${col}" opacity=".15"/><path d="${d}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round"/></svg>`}
function barsList(items,col){if(!items.length)return'<div class="empty">Todavía nada.</div>';const max=Math.max(1,...items.map(x=>x[1]));
  return '<div class="bars">'+items.map(([l,v,h])=>`<div class="bar${v?"":" zero"}"><span class="bl">${h||""}${esc(l)}</span><span class="bv">${v}</span><span class="bt"><i style="width:${v?Math.max(4,100*v/max):0}%;background:${col||"var(--ac)"}"></i></span></div>`).join("")+"</div>"}
function heat(hh,col){const by=new Array(24).fill(0);hh.forEach(x=>{by[x.t.getHours()]+=x.n});const max=Math.max(1,...by);
  return `<div class="heat">${by.map((v,h)=>`<i title="${h}:00 · ${v}" style="${v?`background:${col};opacity:${.25+.75*v/max}`:""}"></i>`).join("")}</div><div class="hl"><span>0 h</span><span>6</span><span>12</span><span>18</span><span>23 h</span></div>`}
const flag=c=>{c=String(c||"").split("-")[0].toUpperCase();return /^[A-Z]{2}$/.test(c)?String.fromCodePoint(...[...c].map(x=>127397+x.charCodeAt(0)))+" ":""};

  <button class="btn" id="go">Entrar</button>

/* ---------- pantallas: inicio (todas las apps) · una app · demos ---------- */
function view(){const h=decodeURIComponent(location.hash.slice(1));if(h.startsWith("app="))return{app:h.slice(4)};if(h==="demos")return{demos:true};return{}}
function go(hash){ANIM=true;if(!view().app&&!view().demos)history.pushState({pav:1},"","#"+hash);else history.replaceState({pav:1},"","#"+hash);render();scrollTo(0,0)}
/* volver: si se entró desde el inicio, «atrás» del navegador (así también funciona el botón atrás del celular) */
function back(){ANIM=true;if(history.state&&history.state.pav)history.back();else{history.replaceState(null,"",location.pathname+location.search);render();scrollTo(0,0)}}
let ANIM=true;/* las barras se animan solo al entrar en una pantalla, no en cada actualización */
addEventListener("popstate",()=>{ANIM=true;render();scrollTo(0,0)});
function avatar(a){return`<span class="av" style="background:${a.col}">${esc((a.title||"?").replace(/^(Escapada a|Mis|App)\s+/i,"").trim()[0]||"?")}${/^ev:|^\(/.test(a.key)?"":`<img src="../${a.key.split("/").map(encodeURIComponent).join("/")}/apple-touch-icon.png" alt="" loading="lazy" onerror="this.remove()">`}</span>`}
function lastTxt(a){const recent=a.last&&Date.now()-a.last<3600e3;return a.last?(recent?'<i>● </i>':"")+"Última vez "+ago(a.last):(LS.get("pav-desde")?"Nada desde que empezaste a contar":"Sin actividad")}
function actCard(stats,col,title){const r=range();let vals,labels,sub;
  if(per==="hoy"){const by=new Array(24).fill(0);const today=ymd(new Date());localHourly(stats).forEach(x=>{if(ymd(x.t)===today)by[x.t.getHours()]+=x.n});vals=by;labels=by.map((_,i)=>i%3?"":i+"h");sub="visitas por hora"}
  else{const map={};stats.forEach(s=>{map[s.day]=(map[s.day]||0)+(s.daily||0)});const days=[];const d=new Date(r.start+"T12:00:00");for(let i=0;i<r.days;i++){days.push(ymd(d));d.setDate(d.getDate()+1)}vals=days.map(x=>map[x]||0);labels=days.map(dlabel);sub="visitas por día"}
  return`<section class="card"><div class="ch"><h2>${title||"Actividad"}</h2><em>${sub}</em></div><div class="cb">${barsChart(vals,labels,150,col)}</div></section>`}
function kpis(list){return`<div class="kpis">${list.map(([v,l])=>`<div class="kpi"><b>${typeof v==="number"?fmtN(v):v}</b><span>${l}</span></div>`).join("")}</div>`}

const SHOW_DEMOS=false;/* «Demos y promoción» oculto por ahora (Javier, 21 nov): cambiar a true para volver a mostrarlo */

function fdesde(){const d=new Date(LS.get("pav-desde"));d.setMinutes(0,0,0);return d.getDate()+" "+MES[d.getMonth()]+" a las "+pad(d.getHours())+":"+pad(d.getMinutes())}
function sizeName(s){const m={phone:"Celular",largephone:"Celular grande",tablet:"Tablet",desktop:"Computador",desktophd:"Computador grande",unknown:"Otra"};return m[String(s).toLowerCase()]||s}
function detail(a){
  const cat={tab:[],stop:[],go:[],time:{},style:[],other:[]};
  a.ev.forEach(e=>{const t=e.act;let m;
    if(m=t.match(/^pestaña (.+)$/))cat.tab.push([m[1],e.n]);
    else if(m=t.match(/^abrió parada: (.+)$/))cat.stop.push([m[1],e.n]);
    else if(m=t.match(/^cómo llegar: (.+)$/))cat.go.push([m[1],e.n]);
    else if(m=t.match(/^usó (\d+) min$/))cat.time[m[1]]=(cat.time[m[1]]||0)+e.n;
    else if(m=t.match(/^estilo: (.+)$/))cat.style.push([m[1],e.n]);
    else if(m=t.match(/^tocó: (.+)$/))(cat.tap=cat.tap||[]).push([m[1],e.n]);
    else cat.other.push([t,e.n])});
  const srt=x=>x.sort((p,q)=>q[1]-p[1]);
  const hh=localHourly(a.stats).concat(...a.ev.map(e=>localHourly(e.stats)));
  let s=`<h3>A qué hora la usan</h3>${heat(hh,a.col)}`;
  if(a.folio){s+=`<h3>Apps que tocaron</h3>${barsList(srt(cat.tap||[]),a.col)}`;return s}
  s+=`<h3>Cuánto rato seguido</h3><div class="steps">${[1,5,15,30,60].map(m=>`<div class="step${cat.time[m]?" on":""}"><b>${cat.time[m]||0}</b><span>${m} min</span></div>`).join("")}</div><p class="note">Veces que alguien llegó a ese tiempo con la app en pantalla.</p>`;
  const M=menuFor(a.key);
  if(M&&M.tabs){const n={};cat.tab.forEach(([t,v])=>{n[t]=(n[t]||0)+v});
    const inMenu=M.tabs.map(t=>[t,n[t]||0]),extra=srt(cat.tab.filter(([t])=>!M.tabs.includes(t)));
    const unused=inMenu.filter(x=>!x[1]).length;
    s+=`<h3>Pestañas</h3>${barsList(inMenu,a.col)}<p class="note">Todas las pestañas que trae la app, en el orden del menú${unused?` · ${unused===1?"1 sin usar":unused+" sin usar"}`:""}.</p>`;
    if(extra.length)s+=`<h3>Otras páginas</h3>${barsList(extra,a.col)}`}
  else s+=`<h3>Pestañas</h3>${M?"":'<p class="note">Leyendo el menú de la app…</p>'}${barsList(srt(cat.tab),a.col)}`;
  if(cat.stop.length)s+=`<h3>Paradas que abrieron</h3>${barsList(srt(cat.stop).slice(0,10),a.col)}`;
  if(cat.go.length)s+=`<h3>«Cómo llegar» a…</h3>${barsList(srt(cat.go).slice(0,10),a.col)}`;
  if(cat.other.length)s+=`<h3>Otras acciones</h3>${barsList(srt(cat.other),a.col)}`;
  if(cat.style.length)s+=`<h3>Estilo elegido</h3>${barsList(srt(cat.style),a.col)}`;
  if(!a.ev.length)s+='<p class="note">Esta app todavía no tiene el contador de acciones; solo se ven sus visitas.</p>';
  return s}
function bind(){
  document.querySelectorAll("[data-per]").forEach(b=>b.onclick=()=>{ANIM=true;per=b.dataset.per;LS.set(K.per,per);DATA=null;render();load()});
  document.querySelectorAll("[data-app]").forEach(b=>b.onclick=()=>{go("app="+encodeURIComponent(b.dataset.app))});
  document.querySelectorAll("[data-demos]").forEach(b=>b.onclick=()=>{go("demos")});
  ["#bk","#bk2"].forEach(x=>{$(x)&&($(x).onclick=back)});
  $("#rf")&&($("#rf").onclick=load);
  $("#cf")&&($("#cf").onclick=settings)}
function settings(){const d=document.createElement("div");d.className="sheet";
  d.innerHTML=`<div><h2>Ajustes</h2><p class="note" style="margin:0 0 12px">${demo?"Estás viendo datos de ejemplo.":"Token guardado en este celular."}</p>

  <button class="btn" id="nt">${demo?"Poner mi token":"Cambiar token"}</button>
  <a class="btn g" style="text-align:center;text-decoration:none" href="https://javierov.goatcounter.com" target="_blank" rel="noopener">Abrir GoatCounter</a>
  <button class="btn g" id="cl">Cerrar</button></div>`;
  document.body.appendChild(d);d.onclick=e=>{if(e.target===d||e.target.id==="cl")d.remove()};
  $("#desde").onclick=()=>{if(LS.get("pav-desde"))LS.del("pav-desde");else LS.set("pav-desde",new Date().toISOString().replace(/\.\d+Z$/,"Z"));d.remove();DATA=null;render();load()};
  $("#me").onclick=()=>{if(LS.get("javierov-nostats")==="1")LS.del("javierov-nostats");else LS.set("javierov-nostats","1");$("#me").textContent=LS.get("javierov-nostats")==="1"?"✓ Este equipo no cuenta en las estadísticas":"No contar mis visitas en este equipo"};
  $("#nt").onclick=()=>{LS.del(K.tok);demo=false;DATA=null;d.remove();setup()}}
function start(){render();load();clearInterval(timer);timer=setInterval(()=>{if(document.visibilityState==="visible")load()},60000)}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&(demo||LS.get(K.tok))){load()}else if(DATA)render()});

function DEMO(path,params){
  const today=new Date(),days=[];const r=range();const d=new Date(r.start+"T12:00:00");for(let i=0;i<r.days;i++){days.push(ymd(d));d.setDate(d.getDate()+1)}
  const rnd=(s=>()=>(s=(s*16807)%2147483647)/2147483647)(42);
  const mk=(scale,peak)=>days.map((day,i)=>{const hourly=new Array(24).fill(0);let tot=0;for(let h=7;h<23;h++){const v=Math.round(rnd()*scale*(Math.abs(h-peak)<3?2:.4)*(i>days.length-3?1.6:1));hourly[h]=v;tot+=v}return{day,daily:tot,hourly}});
  if(path==="/stats/total")return{total:0,total_events:0,stats:[]};
  if(path==="/stats/hits"){const H=[];let id=1;
    const app=(p,t,sc,pk,pre,evs)=>{H.push({path:p,title:t,event:false,count:0,path_id:id++,stats:mk(sc,pk)});H[H.length-1].count=H[H.length-1].stats.reduce((s,x)=>s+x.daily,0);
      evs.forEach(([a,n])=>H.push({path:pre+" · "+a,title:a,event:true,count:n,path_id:id++,stats:mk(n/(days.length*6),pk)}))};
    app("/demo-escapada-a-toledo/","Escapada a Toledo",.6,11,"Toledo",[["pestaña Ruta",9],["pestaña Mapa",6],["pestaña Comer",4],["abrió parada: Catedral Primada",3],["abrió parada: Museo del Greco",2],["abrió parada: Puente de San Martín",1],["cómo llegar: Ave Fénix",2],["cómo llegar: Obrador Santo Tomé",1],["usó «Dónde estoy»",3],["usó 1 min",5],["usó 5 min",3],["usó 15 min",1],["estilo: noche",1]]);
    app("/demo-mis-vacaciones/","Mis Vacaciones",.5,20,"Mis Vacaciones",[]);
    app("/demo-escapada-a-europa/","Escapada a Europa",.3,9,"Europa",[]);
    [["demo:cata · Toledo · abrió la app",3],["demo:cata · Toledo · pestaña Mapa",2],["demo:cata · Toledo · usó «Dónde estoy»",1],["demo:cata · Toledo · abrió parada: Catedral Primada",1],["demo:cata · Toledo · usó 5 min",1],["demo:cata · Mis Vacaciones · abrió la app",1],["demo:portafolio · Portafolio · abrió el portafolio",2],["demo:portafolio · Portafolio · tocó: Lima Familia",1]].forEach(([p,n])=>H.push({path:p,title:p,event:true,count:n,path_id:id++,stats:mk(n/(days.length*6),16)}));
    return{hits:H,more:false,total:0}}
  const S={locations:[["ES","Spain",18],["CL","Chile",6],["PT","Portugal",2]],systems:[["ios","iOS",15],["android","Android",9],["win","Windows",2]],browsers:[["safari","Safari",14],["chrome","Chrome",11],["ff","Firefox",1]],sizes:[["phone","phone",22],["desktop","desktop",3],["tablet","tablet",1]]};
  const k=path.split("/").pop();
  if(params&&params.include_paths){const n=String(params.include_paths).split(",").reduce((s,x)=>s+ +x,0);
    const L=[[["ES","Spain",4],["CL","Chile",1]],[["PE","Peru",3]],[["CL","Chile",2]],[["PT","Portugal",2],["ES","Spain",1]]][n%4];
    const P={locations:L,systems:[[["android","Android",3]],[["ios","iOS",2],["android","Android",1]]][n%2],sizes:[[["phone","phone",3]],[["phone","phone",2],["desktop","desktop",1]]][n%2]};
    return{stats:(P[k]||[]).map(([id,name,count])=>({id,name,count})),more:false}}
  return{stats:(S[k]||[]).map(([id,name,count])=>({id,name,count})),more:false}}
